<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Secret Missions</title>

<style>
/*
VOICE: loud, playful, after-dark; one-handed and readable in a dim room
IDEA: a glowing VIP pass / sealed mission card you keep in your pocket
PICTURE: the mission card itself, big type on a neon-edged slab
COLOUR and TYPE: near-black plum, hot pink action, cyan + lime highlights; Unbounded + Inter
LAYOUT: single column, big thumb targets, bottom tab bar during play
*/
:root{--bg:#0e0816;--s1:#1a1026;--s2:#26173a;--line:#3b2754;--ink:#f8f1ff;--mut:#b6a6cc;--pink:#ff2e93;--cyan:#22e6d8;--lime:#c6ff3d;--red:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip}
body{min-height:100dvh;background:radial-gradient(120% 55% at 50% -12%,#3d0f4a 0,transparent 62%),radial-gradient(90% 50% at 110% 105%,#0a3c46 0,transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 108px)}
h1,h2,h3,.display{font-family:Unbounded,Inter,sans-serif;line-height:1.08;margin:0}
h1{font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;font-weight:800;margin:8px 0 16px}
h3{font-size:18px;font-weight:600;margin:28px 0 10px}
p{margin:0 0 10px}
small{font-size:13px}
.muted{color:var(--mut)}.small{font-size:14px}.center{text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:14px}
.brand{font:800 15px Unbounded,sans-serif;color:var(--pink);text-shadow:0 0 18px rgba(255,46,147,.6)}
.net{font:600 13px Inter;padding:6px 12px;border-radius:99px;background:var(--s2);color:var(--mut);white-space:nowrap}
.net.ok{color:var(--lime)}.net.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:7px;box-shadow:0 0 8px var(--lime)}
.net.bad{color:#ffb35a}
.back{background:none;border:0;color:var(--mut);font:600 16px Inter;min-height:44px;padding:0 4px}
.hero{padding:34px 0 22px}
.hero h1{background:linear-gradient(100deg,#fff 10%,var(--pink) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,46,147,.35))}
.lead{font-size:18px;color:var(--mut);margin-top:16px;max-width:30em}
.stack{display:grid;gap:12px;margin:22px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:12px 18px;border:0;border-radius:18px;font:700 18px Inter,sans-serif;color:#17041f;background:var(--pink);box-shadow:0 0 26px rgba(255,46,147,.45);cursor:pointer;transition:transform .1s;margin-top:12px}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--s2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.big{min-height:76px;font-size:22px;font-family:Unbounded,sans-serif;font-weight:800}
.btn.slim{min-height:48px;font-size:16px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
.btn[disabled]{opacity:.45;box-shadow:none}
.link{display:block;margin:18px auto 0;background:none;border:0;color:var(--mut);font:600 15px Inter;text-decoration:underline;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.resume{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;padding:14px 18px;border-radius:18px;border:1px solid var(--cyan);background:rgba(34,230,216,.08);color:var(--ink);font:600 16px Inter;text-align:left}
.resume b{color:var(--cyan);font-family:Unbounded}.arrow{font-size:22px;color:var(--cyan)}
.how{padding-left:22px;color:var(--mut);margin-top:30px}.how li{margin-bottom:12px}.how b{color:var(--ink)}
.form{display:grid;gap:18px}
.fld{display:grid;gap:8px}.fld>span{font-weight:700}.fld small{display:block;font-weight:400;color:var(--mut)}
input[type=text],input:not([type]),textarea{width:100%;font:16px Inter,sans-serif;padding:15px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);color:var(--ink)}
textarea{resize:vertical;min-height:96px}
.codein{font:800 34px Unbounded,sans-serif!important;letter-spacing:.3em;text-transform:uppercase;text-align:center;color:var(--lime)!important}
.tg{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-top:12px;cursor:pointer}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg small{display:block;color:var(--mut)}
.sw{flex:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+.sw{background:var(--pink)}.tg input:checked+.sw::after{transform:translateX(20px)}
.tg input:focus-visible+.sw{outline:3px solid var(--cyan)}

.seg button{min-height:60px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font:600 15px Inter;display:grid;gap:2px;align-content:center}
.seg button small{color:var(--mut);font-size:12px;line-height:1.25}
.seg button.on{background:var(--pink);border-color:var(--pink);color:#17041f;box-shadow:0 0 18px rgba(255,46,147,.4)}.seg button.on small{color:#3b0a2b}
.lbl{font:600 13px Inter;color:var(--cyan);margin-bottom:8px;letter-spacing:.02em}
.code{font:800 clamp(56px,18vw,76px)/1 Unbounded,sans-serif;letter-spacing:.08em;color:var(--lime);text-align:center;text-shadow:0 0 30px rgba(198,255,61,.45);margin:2px 0 18px}
.code.sm{font-size:40px;margin-top:18px}
.qr{background:#fff;border-radius:20px;padding:12px;width:min(230px,62vw);margin:0 auto 14px;box-shadow:0 0 40px rgba(34,230,216,.3)}
.qr svg{display:block;width:100%;height:auto}
.warn{background:rgba(255,179,90,.12);border:1px solid #ffb35a;color:#ffd7a6;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px}
.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-weight:600;min-height:44px}
.chips li.off{opacity:.5}.chips small{color:var(--cyan);font-weight:600}
.x{min-width:36px;min-height:36px;border-radius:99px;border:0;background:var(--s1);color:var(--mut);font:600 15px Inter;padding:0 10px}
.summary{margin-top:22px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--mut);font-size:15px}
.wait{display:flex;align-items:center;gap:12px;justify-content:center;padding:18px;color:var(--mut);font-weight:600;text-align:center}
.pulse{flex:none;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(34,230,216,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(34,230,216,0)}100%{box-shadow:0 0 0 0 rgba(34,230,216,0)}}
.me{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-weight:700;font-size:18px}
.pts{font:800 24px Unbounded,sans-serif;color:var(--lime);margin-left:auto;white-space:nowrap}.pts small{font:600 13px Inter;color:var(--mut)}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,#2c1244 0%,#170c24 70%);border:1px solid #5e2c80;border-radius:28px;padding:26px 22px 22px;box-shadow:0 0 0 1px rgba(255,46,147,.22),0 24px 60px -24px rgba(255,46,147,.6)}
.card::before{content:"";position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(34,230,216,.28),transparent 70%)}
.card.fresh{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
.card.pend{border-color:var(--cyan)}
@keyframes pop{0%{transform:scale(.9) rotate(-2deg);opacity:0}100%{transform:none;opacity:1}}
.mtext{position:relative;font:800 clamp(26px,7.6vw,36px)/1.14 Unbounded,sans-serif;margin:6px 0 16px;text-wrap:balance;overflow-wrap:anywhere}
.mtext.dim{color:var(--mut);font-size:22px}
.hush{position:relative;color:var(--mut);font-size:14px;margin:0}
.board{list-style:none;padding:0;margin:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:60px}
.row.mine .nm{color:var(--pink)}
.rank{width:26px;font:800 16px Unbounded,sans-serif;color:var(--mut)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.nm{font-weight:700;display:grid}.nm small{font-weight:400;color:var(--mut)}
.feed{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.feed li{padding:14px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.feed p{margin:0 0 4px}.feed .cons{color:var(--lime)}.feed time{font-size:13px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.recap h1{font-size:clamp(36px,11vw,54px);color:var(--lime);text-shadow:0 0 30px rgba(198,255,61,.4);margin:6px 0 8px;overflow-wrap:anywhere}
.awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:22px 0}
.awards div{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 10px;display:grid;gap:4px;text-align:center}
.awards small{color:var(--cyan);font-weight:600}.awards b{font:800 17px Unbounded,sans-serif;overflow-wrap:anywhere}.awards span{font-size:13px;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:rgba(14,8,22,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{min-height:56px;background:none;border:0;color:var(--mut);font:700 15px Inter;border-radius:14px}
.tabs button.on{color:var(--ink);background:var(--s2)}
.tabs .badge{color:var(--cyan)}
#modal .ov{position:fixed;inset:0;z-index:50;background:rgba(6,2,10,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sheet{width:100%;max-width:520px;background:linear-gradient(170deg,#2a1440,#160b22);border:1px solid #5e2c80;border-radius:28px;padding:26px 22px 20px;animation:up .4s cubic-bezier(.2,.9,.3,1.2);max-height:90dvh;overflow:auto}
.sheet.ask{border-color:var(--cyan);box-shadow:0 0 50px -10px rgba(34,230,216,.5)}
.q{font:800 clamp(22px,6.4vw,30px)/1.18 Unbounded,sans-serif;margin:8px 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.q.big{font-size:clamp(26px,7.5vw,36px);color:var(--lime)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px}.two .btn{margin-top:6px}
@keyframes up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--ink);color:#17041f;font-weight:700;padding:12px 18px;border-radius:14px;max-width:90vw;transition:.25s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#news{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:65;max-width:540px;margin:0 auto;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#ff2e93,#a63bff);color:#fff;font-weight:600;box-shadow:0 10px 40px -8px rgba(255,46,147,.7);transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#news.show{transform:none}#news b{font-family:Unbounded,sans-serif}#news small{display:block;opacity:.9;margin-top:2px}
#fx span{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(760deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const rid=(n=10)=>{const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';for(const x of crypto.getRandomValues(new Uint8Array(n)))s+=a[x%a.length];return s};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const genCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(const x of crypto.getRandomValues(new Uint8Array(4)))s+=a[x%a.length];return s};

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* sound: browsers only allow it after the first tap, so we unlock on any click */
let actx=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function chime(notes){
  if(!actx)return;
  try{let t=actx.currentTime;for(const f of notes){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.3);t+=0.16}}catch(e){}
}
const TITLE='Secret Missions';let flashT=null;
function flashTitle(msg){clearInterval(flashT);let on=false;flashT=setInterval(()=>{on=!on;document.title=on?msg:TITLE},900);document.title=msg}

function news(html){
  const n=$('#news');n.innerHTML=html;n.classList.add('show');clearTimeout(news.h);news.h=setTimeout(()=>n.classList.remove('show'),5000);
}
function boom(){
  buzz([90,50,140]);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#ff2e93','#22e6d8','#c6ff3d','#ffd23d','#a66bff'];let h='';
  for(let i=0;i<46;i++)h+=`<span style="left:${(Math.random()*100).toFixed(1)}vw;background:${cols[i%5]};--dx:${(Math.random()*40-20).toFixed(1)}vw;animation-delay:${(Math.random()*.25).toFixed(2)}s;animation-duration:${(1.2+Math.random()*.9).toFixed(2)}s"></span>`;
  $('#fx').innerHTML=h;setTimeout(()=>{$('#fx').innerHTML=''},2600);
}

let H=null, hostPeer=null, lastStart=0;

function newPlayer(name,nd){return{name,nd:!!nd,score:0,hits:0,mission:null,pending:null,rerolls:H?H.settings.rerolls:2,used:[],usedC:[],notices:[],removed:false,joined:Date.now()}}
function active(){return Object.entries(H.players).filter(([,p])=>!p.removed)}
function nameOf(id){const p=H.players[id];return p?p.name:'Someone'}
function isOn(id){if(id===H.hostPid)return true;const c=conns.get(id);return !!(c&&c.open)}
function parseCustom(d){
  const lines=s=>String(s||'').split('\n').map(x=>x.trim().slice(0,120)).filter(Boolean).slice(0,60);
  return{raw:{cm:d.cm||'',cc:d.cc||''},missions:lines(d.cm).map(t=>t.includes('@')?t.replace(/@/g,'{t}'):'With {t}: '+t),cons:lines(d.cc)};
}
// mission categories: hand-written list (weight 4), each big group (weight 1), custom (weight 3)
function missionCats(){
  const fam=!!H.settings.family,sp=H.settings.spice;
  const cats=[{w:4,list:(fam?FM:M).map((x,i)=>({id:(fam?'f':'b')+i,s:x[0],m:x[1],q:x[2]})).filter(x=>x.s<=sp)}];
  for(const g of GROUPS){
    if(g.s>sp)continue;
    const items=L(g.a).map((x,i)=>({id:g.k+i,x})).concat(L(fam?g.f:g.p).map((x,i)=>({id:g.k+(fam?'f':'p')+i,x})));
    cats.push({w:1,list:items.map(o=>({id:o.id,m:g.m(o.x),q:g.q(o.x)}))});
  }
  if(H.custom.missions.length)cats.push({w:3,list:H.custom.missions.map((m,i)=>({id:'c'+i,m,q:null}))});
  return cats.filter(c=>c.list.length);
}
function weighted(cats){let r=Math.random()*cats.reduce((a,c)=>a+c.w,0);for(const c of cats){r-=c.w;if(r<=0)return c}return cats[cats.length-1]}
function missionCount(){return missionCats().reduce((a,c)=>a+c.list.length,0)}
function assign(pid){
  const p=H.players[pid];
  const others=active().map(([id])=>id).filter(id=>id!==pid);
  if(!others.length){p.mission=null;return}
  const prev=p.mission&&p.mission.tid;
  let cand=others.length>1&&prev?others.filter(id=>id!==prev):others;
  const load=id=>active().filter(([oid,q])=>oid!==pid&&q.mission&&q.mission.tid===id).length;
  const min=Math.min(...cand.map(load));cand=cand.filter(id=>load(id)===min);
  const tid=pick(cand);
  const all=missionCats();
  // nobody in the room should hold the same mission at the same time
  const held=new Set(active().map(([,q])=>q.mission&&q.mission.id).filter(Boolean));
  let cats=all.map(c=>({w:c.w,list:c.list.filter(x=>!p.used.includes(x.id)&&!held.has(x.id))})).filter(c=>c.list.length);
  if(!cats.length){p.used=[];cats=all}
  const mm=pick(weighted(cats).list);p.used.push(mm.id);if(p.used.length>400)p.used.shift();
  p.mission={id:mm.id,m:mm.m,q:mm.q,tid,at:Date.now()};
}
function pickCons(target,holderName){
  const fam=!!H.settings.family;
  const drink=!fam&&H.settings.drinking&&!target.nd;
  const sp=H.settings.spice;
  const cats=[{w:4,list:(fam?FC:CQ).filter(x=>x[0]<=sp&&(drink||!x[1])).map(x=>x[2])}];
  for(const g of CGROUPS)if(g.s<=sp)cats.push({w:g.w,list:L(g.a).map(g.c)});
  const cust=H.custom.cons.filter(c=>drink||!DRINKY.test(c));if(cust.length)cats.push({w:3,list:cust});
  let fresh=cats.map(c=>({w:c.w,list:c.list.filter(x=>!target.usedC.includes(x))})).filter(c=>c.list.length);
  if(!fresh.length){target.usedC=[];fresh=cats.filter(c=>c.list.length)}
  const c=pick(weighted(fresh).list);target.usedC.push(c);if(target.usedC.length>80)target.usedC.shift();
  return fill(c,target.name,holderName);
}
function cancelPendingFor(pid){
  for(const c of Object.values(H.claims)){
    if(c.st==='pending'&&(c.from===pid||c.to===pid)){c.st='cancel';const hp=H.players[c.from];if(hp)hp.pending=null}
  }
}
function handle(pid,msg){
  const p=H.players[pid];if(!p||p.removed||!msg)return;
  switch(msg.t){
    case 'claim':{
      if(H.status!=='playing'||!p.mission||p.pending)return;
      const tp=H.players[p.mission.tid];
      if(!tp||tp.removed){assign(pid);break}
      const cid=rid(8);
      H.claims[cid]={from:pid,to:p.mission.tid,m:p.mission.m,q:p.mission.q,at:Date.now(),st:'pending'};
      p.pending=cid;break}
    case 'cancel':{
      const c=p.pending&&H.claims[p.pending];if(c&&c.st==='pending')c.st='cancel';p.pending=null;break}
    case 'answer':{
      const c=H.claims[msg.cid];if(!c||c.to!==pid||c.st!=='pending')return;
      const hp=H.players[c.from];if(!hp){c.st='cancel';break}
      const mtext=fill(c.m,p.name,hp.name);
      if(msg.yes){
        const cons=pickCons(p,hp.name);
        c.st='yes';hp.score++;p.hits++;
        H.log.push({at:Date.now(),from:c.from,to:pid,m:mtext,cons});
        p.notices.push({id:rid(6),k:'cons',text:cons,by:hp.name,m:mtext});
        hp.notices.push({id:rid(6),k:'scored',by:p.name,text:cons});
        hp.pending=null;assign(c.from);
      }else{
        c.st='no';hp.pending=null;
        hp.notices.push({id:rid(6),k:'denied',by:p.name});
      }
      break}
    case 'reroll':
      if(H.status==='playing'&&p.rerolls>0&&!p.pending){p.rerolls--;assign(pid)}else return;
      break;
    case 'ack':p.notices=p.notices.filter(n=>n.id!==msg.id);break;
    case 'nd':p.nd=!!msg.v;break;
    default:return;
  }
  commit();
}
function hostAct(a,arg){
  if(a==='start'){
    if(active().length<2)return;
    H.status='playing';
    for(const [id,p] of active()){p.rerolls=H.settings.rerolls;if(!p.mission)assign(id)}
  }else if(a==='end'){
    for(const c of Object.values(H.claims))if(c.st==='pending')c.st='cancel';
    for(const [,p] of active())p.pending=null;
    H.status='ended';
  }else if(a==='reset'){
    H.status='lobby';H.log=[];H.claims={};
    for(const [,p] of active())Object.assign(p,{score:0,hits:0,mission:null,pending:null,notices:[],used:[],usedC:[],rerolls:H.settings.rerolls});
  }else if(a==='kick'){
    const p=H.players[arg];if(!p||arg===H.hostPid)return;
    cancelPendingFor(arg);p.removed=true;p.mission=null;p.pending=null;
    if(H.status==='playing')for(const [id,q] of active())if(q.mission&&q.mission.tid===arg)assign(id);
    const cn=conns.get(arg);
    if(cn){try{cn.send({t:'kicked'})}catch(e){}setTimeout(()=>{try{cn.close()}catch(e){}},400);conns.delete(arg)}
  }
  commit();
}
function view(pid){
  const p=H.players[pid];
  const players=Object.entries(H.players).filter(([,q])=>!q.removed).map(([id,q])=>({id,name:q.name,score:q.score,hits:q.hits,on:isOn(id),host:id===H.hostPid,me:id===pid}));
  const mission=p.mission?{text:fill(p.mission.m,nameOf(p.mission.tid),p.name)}:null;
  const reqs=Object.entries(H.claims).filter(([,c])=>c.to===pid&&c.st==='pending').map(([cid,c])=>{
    const h=nameOf(c.from);
    return{cid,from:h,q:c.q?fill(c.q,p.name,h):`${h}’s mission was: “${fill(c.m,p.name,h)}”. Did it happen?`};
  });
  const pc=p.pending&&H.claims[p.pending];
  return{t:'state',code:H.code,status:H.status,spice:H.settings.spice,family:!!H.settings.family,pool:missionCount(),drinking:!H.settings.family&&H.settings.drinking,swaps:H.settings.rerolls,host:nameOf(H.hostPid),
    players,me:{id:pid,name:p.name,nd:p.nd,score:p.score,mission,pending:pc?nameOf(pc.to):null,rerolls:p.rerolls,notices:p.notices},
    reqs,log:H.log.map(l=>({from:nameOf(l.from),to:nameOf(l.to),m:l.m,cons:l.cons,at:l.at}))};
}
function save(){if(H)LS.set('sm-state-'+H.code,H)}
function broadcast(){
  if(!H)return;
  for(const [pid,c] of conns){if(c.open&&H.players[pid]&&!H.players[pid].removed){try{c.send(view(pid))}catch(e){}}}
}
function commit(){
  if(!H)return;
  if(H.log.length>300)H.log=H.log.slice(-300);
  const cl=Object.entries(H.claims);
  if(cl.length>200)for(const [cid,c] of cl.slice(0,cl.length-200))if(c.st!=='pending')delete H.claims[cid];
  save();broadcast();onState(view(H.hostPid));
}
function onHostData(conn,d){
  if(!d||typeof d!=='object'||!H)return;
  if(d.t==='join'){
    const pid=String(d.pid||'').slice(0,24);if(!pid||pid===H.hostPid)return;
    const raw=String(d.name||'').trim().slice(0,20)||'Player';
    let p=H.players[pid];
    if(p&&p.removed){try{conn.send({t:'kicked'})}catch(e){}return}
    const taken=n=>active().some(([id,q])=>id!==pid&&q.name.toLowerCase()===n.toLowerCase());
    let nm=raw,i=2;while(taken(nm))nm=raw+' '+(i++);
    if(!p){
      if(active().length>=20){try{conn.send({t:'full'})}catch(e){}return}
      p=H.players[pid]=newPlayer(nm,d.nd);
      if(H.status==='playing')assign(pid);
    }else{p.name=nm;p.nd=!!d.nd}
    const old=conns.get(pid);if(old&&old!==conn){try{old.close()}catch(e){}}
    conns.set(pid,conn);conn._pid=pid;
    if(H.status==='playing')for(const [id,q] of active())if(!q.mission)assign(id);
    commit();return;
  }
  if(conn._pid&&conns.get(conn._pid)===conn)handle(conn._pid,d);
}
function dropConn(conn){if(conn._pid&&conns.get(conn._pid)===conn){conns.delete(conn._pid);if(H){broadcast();onState(view(H.hostPid))}}}
function startHostPeer(){
  if(typeof Peer==='undefined'){setNet('nolib');return}
  lastStart=Date.now();
  if(hostPeer&&!hostPeer.destroyed){try{hostPeer.destroy()}catch(e){}}
  setNet('connecting');
  const peer=new Peer(PREFIX+H.code,{debug:0});hostPeer=peer;
  peer.on('open',()=>{if(hostPeer!==peer)return;if(H.fresh){delete H.fresh;save()}setNet('ok')});
  peer.on('connection',conn=>{
    conn.on('data',d=>onHostData(conn,d));
    conn.on('close',()=>dropConn(conn));
    conn.on('error',()=>dropConn(conn));
  });
  peer.on('disconnected',()=>{if(hostPeer===peer)setNet('reconnecting')});
  peer.on('error',e=>{
    if(hostPeer!==peer)return;
    if(e.type==='unavailable-id'){
      if(H.fresh){ // brand-new room code clashed: pick another
        LS.del('sm-state-'+H.code);H.code=genCode();
        const me=LS.get('sm-me',{});me.code=H.code;LS.set('sm-me',me);
        commit();startHostPeer();
      }else{setNet('restoring');try{peer.destroy()}catch(x){}}
      return;
    }
    if(e.type==='browser-incompatible'){setNet('nolib');return}
    if(e.type!=='peer-unavailable')setNet('reconnecting');
  });
}
function heal(){
  if(mode!=='host'||!H)return;
  if(!hostPeer||hostPeer.destroyed){if(Date.now()-lastStart>4000)startHostPeer();return}
  if(hostPeer.disconnected){try{hostPeer.reconnect()}catch(e){if(Date.now()-lastStart>4000)startHostPeer()}}
}
async function wake(){
  if(mode!=='host'||!wakeOn||wl||document.visibilityState!=='visible')return;
  try{if(navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}
}
function unwake(){if(wl){try{wl.release()}catch(e){}wl=null}}

/* =========================================================
   CLIENT: connects to the host's phone
   ========================================================= */
let C=null;
function startClient(o){
  if(typeof Peer==='undefined'){toast('Couldn’t load the game engine. Check your internet and reload.');return}
  mode='client';V=null;lastJson='';
  C={code:o.code,pid:o.pid,name:o.name,nd:!!o.nd,peer:null,conn:null,last:0,tried:0,peerAt:0};
  LS.set('sm-me',{code:C.code,pid:C.pid,name:C.name,nd:C.nd,host:false});LS.set('sm-name',C.name);
  ui.screen='connecting';renderConnecting();clientConnect();
}
function makeClientPeer(){
  setNet('connecting');
  const p=new Peer({debug:0});C.peer=p;C.peerAt=Date.now();
  p.on('open',()=>{if(C&&C.peer===p)openConn()});
  p.on('error',e=>{if(!C||C.peer!==p)return;setNet(e.type==='peer-unavailable'?'nohost':'reconnecting')});
}
function clientConnect(){
  if(!C)return;
  C.tried=Date.now();
  if(C.conn){if(C.conn.open&&Date.now()-C.last<25000)return;const c=C.conn;C.conn=null;try{c.close()}catch(e){}}
  const p=C.peer;
  if(!p||p.destroyed||(!p.open&&!p.disconnected&&Date.now()-C.peerAt>15000)){if(p&&!p.destroyed){try{p.destroy()}catch(e){}}makeClientPeer();return}
  if(p.disconnected){try{p.reconnect()}catch(e){try{p.destroy()}catch(x){}C.peer=null}return}
  if(p.open)openConn();
}
function openConn(){
  if(!C||(C.conn&&C.conn.open))return;
  const conn=C.peer.connect(PREFIX+C.code,{reliable:true});C.conn=conn;
  conn.on('open',()=>{if(!C||C.conn!==conn)return;C.last=Date.now();setNet('ok');conn.send({t:'join',pid:C.pid,name:C.name,nd:C.nd})});
  conn.on('data',d=>{if(!C||C.conn!==conn)return;C.last=Date.now();
    if(d&&d.t==='kicked'){toast('The host removed you from this game');leave();return}
    if(d&&d.t==='full'){toast('This game is full (20 players)');leave();return}
    if(d&&d.t==='state')onState(d)});
  conn.on('close',()=>{if(!C||C.conn!==conn)return;C.conn=null;setNet('reconnecting');setTimeout(()=>{if(C&&!C.conn)clientConnect()},1500)});
  conn.on('error',()=>{if(!C||C.conn!==conn)return;C.conn=null;setNet('reconnecting')});
}
function send(msg){
  if(mode==='host'){handle(H.hostPid,msg);return}
  if(C&&C.conn&&C.conn.open){try{C.conn.send(msg)}catch(e){toast('Not connected, retrying…')}}
  else{toast('Not connected to the host yet, retrying…');clientConnect()}
}
function leave(){
  if(mode==='host'){unwake();if(hostPeer){try{hostPeer.destroy()}catch(e){}}hostPeer=null;conns.clear();H=null}
  if(C){const p=C.peer;C=null;if(p){try{p.destroy()}catch(e){}}}
  mode=null;V=null;lastJson='';LS.del('sm-me');
  ui={screen:'home',tab:'mission',qr:false,kick:null,end:false,done:new Set(),lastM:''};
  $('#modal').innerHTML='';modalKey='';setNet('idle');renderHome();
}

/* watchdog: keeps everyone connected through screen locks and wifi hiccups */
setInterval(()=>{
  if(mode==='client'&&C){const ok=C.conn&&C.conn.open&&Date.now()-C.last<25000;if(!ok&&Date.now()-C.tried>6000)clientConnect()}
  if(mode==='host')heal();
},3000);
setInterval(()=>{if(mode==='host')broadcast()},8000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(mode==='client'&&C){if(!(C.conn&&C.conn.open)||Date.now()-C.last>10000){C.last=0;clientConnect()}}
  if(mode==='host'){heal();wake();broadcast()}
});

function setNet(s){net=s;const el=$('#net');if(el){el.className='net '+NET[s][1];el.textContent=NET[s][0]}if(ui.screen==='connecting')renderConnecting()}
function hdr(){return`<header class="top"><div class="brand">Secret Missions</div><span id="net" class="net ${NET[net][1]}">${NET[net][0]}</span></header>`}
function onState(d){
  const j=JSON.stringify(d);if(j===lastJson&&ui.screen==='game')return;lastJson=j;
  // banner for everyone else when a mission gets completed somewhere in the room
  const prevLen=V&&V.code===d.code?V.log.length:null;

  if(ui.screen==='connecting')ui.screen='game';

  let body;
  if(!m)body=`<div class="card"><p class="lbl">Your secret mission</p><p class="mtext dim">Waiting for more players to join…</p></div>`;
  else body=`<div class="card ${V.me.pending?'pend':''} ${fresh?'fresh':''}"><p class="lbl">Your secret mission</p><p class="mtext">${esc(m.text)}</p><p class="hush">Keep it secret. Don’t let them catch on.</p></div>
  ${V.me.pending?`<div class="wait"><span class="pulse"></span>Waiting for ${esc(V.me.pending)} to confirm…</div><button class="btn alt" data-a="cancel">Cancel claim</button>`
  :`<button class="btn big" data-a="claim">Mission done!</button><button class="btn alt" data-a="reroll" ${V.me.rerolls>0?'':'disabled'}>Swap mission · ${V.me.rerolls} left</button>`}`;
  return`<div class="me"><span>${esc(V.me.name)}</span><span class="pts">${V.me.score} <small>pts</small></span></div>${body}${ndToggle()}`;
}
function hostPanel(){
  return`<h2>Host controls</h2><p class="muted">Your phone is running the game. If it sleeps, everyone pauses until you’re back — nothing is lost.</p>
  <label class="tg"><input type="checkbox" data-a="wake" ${wakeOn?'checked':''}><span class="sw"></span><span>Keep my screen awake${navigator.wakeLock?'':'<small>Not supported here. Turn off auto-lock in your phone settings.</small>'}</span></label>
  <div class="summary">${summary()}</div><button class="btn alt" data-a="settings">Edit settings</button>
  <button class="btn alt" data-a="qr">${ui.qr?'Hide invite':'Invite someone late'}</button>${ui.qr?`<div class="code sm">${esc(V.code)}</div>${qrBlock(joinUrl(V.code))}`:''}
  <button class="btn danger" data-a="end">${ui.end?'Tap again to end the night':'End the night'}</button>`;
}
function recap(){
  const ps=sorted();const top=ps.length?ps[0].score:0;const mvp=ps.filter(p=>p.score===top&&top>0);
  const maxH=Math.max(0,...ps.map(p=>p.hits));const dared=ps.filter(p=>p.hits===maxH&&maxH>0);
  const minH=Math.min(...ps.map(p=>p.hits));const unt=ps.filter(p=>p.hits===minH);
  const names=a=>a.map(p=>esc(p.name)).join(' & ');
  return`<section class="recap"><p class="lbl center">That’s a wrap</p><h1 class="center">${mvp.length?names(mvp):'Nobody'}</h1>
  <p class="center muted">${mvp.length?`won the night with ${top} mission${top===1?'':'s'}`:'completed a mission. Next time!'}</p>
  <div class="awards"><div><small>Most dared</small><b>${dared.length?names(dared):'—'}</b><span>${maxH} consequence${maxH===1?'':'s'}</span></div>
  <div><small>Untouchable</small><b>${names(unt)}</b><span>${minH} consequence${minH===1?'':'s'}</span></div>
  <div><small>Missions done</small><b>${V.log.length}</b><span>by ${ps.length} players</span></div></div>
  ${scoresList(ps)}<h3>Every mission tonight</h3>${feedList()}
  ${mode==='host'?'<button class="btn big" data-a="reset">Play another round</button><button class="link" data-a="leave">Close the room</button>'
  :`<div class="wait"><span class="pulse"></span>Waiting for ${esc(V.host)}…</div><button class="link" data-a="leave">Leave game</button>`}</section>`;
}
function renderGame(){
  if(!V){$('#app').innerHTML=hdr()+'<div class="wait"><span class="pulse"></span>Setting up…</div>';return}
  let body;
  if(V.status==='lobby')body=lobby();
  else if(V.status==='ended')body=recap();
  else{
    const t=ui.tab;
    body=t==='scores'?`<h2>Scoreboard</h2>${scoresList(sorted())}`:t==='feed'?`<h2>Tonight so far</h2>${feedList()}`:t==='host'&&mode==='host'?hostPanel():missionTab();
    const tabs=[['mission','Mission'],['scores','Scores'],['feed','Feed']];if(mode==='host')tabs.push(['host','Host']);
    body+=`<nav class="tabs">${tabs.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${ui.tab===k?'on':''}">${l}${k==='mission'&&V.me.pending?' <span class="badge">•</span>':''}</button>`).join('')}</nav>`;
  }
  $('#app').innerHTML=hdr()+body;
}
let modalKey='';
function renderModal(){
  if(!V||!mode){if(modalKey){$('#modal').innerHTML='';modalKey=''}return}
  const r=(V.reqs||[]).find(x=>!ui.done.has('r'+x.cid));
  const n=!r&&(V.me.notices||[]).find(x=>!ui.done.has('n'+x.id));
  const key=r?'r'+r.cid:n?'n'+n.id:'';
  if(key===modalKey)return;modalKey=key;
  if(!key){$('#modal').innerHTML='';stopFlash();return}
  if(r){chime([523,659,784,1047]);buzz([200,100,200,100,300]);flashTitle('(!) Confirm a mission')}
  else if(n.k==='cons'){chime([784,659,523]);flashTitle('(!) You got busted')}
  else if(n.k==='scored'){chime([523,784,1047,1319]);flashTitle('(!) Mission complete')}
  else{chime([400,300]);stopFlash()}
  let h='';
  if(r){h=`<p class="lbl">${esc(r.from)} says they completed their secret mission on you</p><p class="q">${esc(r.q)}</p>
    <div class="two"><button class="btn alt" data-a="no" data-id="${esc(r.cid)}">No</button><button class="btn" data-a="yes" data-id="${esc(r.cid)}">Yes, it happened</button></div>`;buzz([40,40,40])}
  else if(n.k==='cons'){h=`<p class="lbl">Busted by ${esc(n.by)}</p><p class="muted small">Their mission: “${esc(n.m)}”</p><p class="lbl" style="margin-top:14px">Your consequence</p><p class="q big">${esc(n.text)}</p><button class="btn big" data-a="ack" data-id="${esc(n.id)}">Done it</button>`;boom()}
  else if(n.k==='scored'){h=`<p class="lbl">Mission complete · +1 point</p><p class="q">${esc(n.by)} confirmed it!</p><p class="muted">Their consequence: <b style="color:var(--lime)">${esc(n.text)}</b>. Make sure they do it.</p><button class="btn big" data-a="ack" data-id="${esc(n.id)}">Next mission</button>`;boom()}
  else{h=`<p class="lbl">Not confirmed</p><p class="q">${esc(n.by)} says it didn’t happen.</p><p class="muted">Your mission is still on. Try again.</p><button class="btn" data-a="ack" data-id="${esc(n.id)}">Keep trying</button>`;buzz([60])}
  $('#modal').innerHTML=`<div class="ov"><div class="sheet ${r?'ask':''}" role="dialog" aria-modal="true">${h}</div></div>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
function readDraft(isNew){
  if(isNew){draft.name=$('#f-name').value.trim().slice(0,20);const nd=$('#f-nd');if(nd)draft.nd=nd.checked}
  const dr=$('#f-drink');if(dr)draft.drinking=dr.checked;draft.cm=$('#f-cm').value;draft.cc=$('#f-cc').value;
}
function createGame(){
  if(typeof Peer==='undefined'){toast('Couldn’t load the game engine. Check your internet and reload.');return}
  if(!draft.name){toast('Enter your name first');$('#f-name').focus();return}
  const pid=rid();
  H={code:genCode(),status:'lobby',hostPid:pid,settings:{spice:draft.spice,drinking:draft.drinking,rerolls:draft.rerolls,family:!!draft.family},custom:{raw:{},missions:[],cons:[]},players:{},claims:{},log:[],fresh:true};
  H.custom=parseCustom(draft);H.players[pid]=newPlayer(draft.name,draft.nd);
  mode='host';LS.set('sm-me',{code:H.code,pid,name:draft.name,host:true});LS.set('sm-name',draft.name);
  ui.screen='game';ui.tab='mission';wakeOn=true;wake();startHostPeer();commit();
}
function resume(){
  const me=LS.get('sm-me',null);if(!me)return renderHome();
  if(me.host){
    const st=LS.get('sm-state-'+me.code,null);
    if(!st){toast('That game isn’t on this phone anymore');LS.del('sm-me');return renderHome()}
    H=st;delete H.fresh;mode='host';ui.screen='game';wakeOn=true;wake();startHostPeer();commit();
  }else startClient(me);
}
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='sf'){
    const isNew=ui.screen==='create';readDraft(isNew);
    if(isNew)createGame();
    else{const wasFam=!!H.settings.family;H.settings={spice:draft.spice,drinking:draft.drinking,rerolls:draft.rerolls,family:!!draft.family};
      if(wasFam!==H.settings.family&&H.status==='playing')for(const [id,p] of active())if(!p.pending){p.used=[];assign(id)}H.custom=parseCustom(draft);
      if(H.status!=='playing')for(const [,p] of active())p.rerolls=H.settings.rerolls;
      ui.screen='game';lastJson='';commit();toast('Settings saved')}
  }else if(e.target.id==='jf'){
    const code=$('#j-code').value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    const name=$('#j-name').value.trim().slice(0,20);
    if(code.length!==4){toast('The room code has 4 letters');return}
    if(!name){toast('Enter your name');return}
    const pid=LS.get('sm-pid-'+code,null)||rid();LS.set('sm-pid-'+code,pid);
    startClient({code,pid,name,nd:$('#j-nd').checked});
  }
});
document.addEventListener('click',e=>{
  unlockAudio();
  const seg=e.target.closest('.seg button');
  if(seg&&draft&&seg.parentElement.dataset.g==='family'){const isNew=ui.screen==='create';readDraft(isNew);draft.family=Number(seg.dataset.v)===1;renderSettings(isNew);return}
  if(seg&&draft){const g=seg.parentElement.dataset.g;draft[g]=Number(seg.dataset.v);seg.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===seg));return}
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  const hadKick=ui.kick,hadEnd=ui.end;
  if(a!=='kick')ui.kick=null;if(a!=='end')ui.end=false;
  switch(a){
    case 'go-create':draft={name:LS.get('sm-name',''),nd:false,family:false,spice:2,drinking:true,rerolls:2,cm:'',cc:''};ui.screen='create';renderSettings(true);scrollTo(0,0);break;
    case 'go-join':ui.screen='join';renderJoin('');break;
    case 'home':ui.screen='home';renderHome();break;
    case 'back-game':ui.screen='game';lastJson='';renderGame();break;
    case 'resume':resume();break;
    case 'settings':draft={family:!!H.settings.family,spice:H.settings.spice,drinking:H.settings.drinking,rerolls:H.settings.rerolls,cm:H.custom.raw.cm||'',cc:H.custom.raw.cc||''};ui.screen='settings';renderSettings(false);scrollTo(0,0);break;
    case 'start':hostAct('start');buzz(60);break;
    case 'end':if(!hadEnd){ui.end=true;renderGame();return}hostAct('end');break;
    case 'reset':hostAct('reset');break;
    case 'kick':if(hadKick!==id){ui.kick=id;renderGame();return}ui.kick=null;hostAct('kick',id);break;
    case 'claim':send({t:'claim'});buzz(30);break;
    case 'cancel':send({t:'cancel'});break;
    case 'reroll':send({t:'reroll'});break;
    case 'yes':case 'no':ui.done.add('r'+id);modalKey='';$('#modal').innerHTML='';send({t:'answer',cid:id,yes:a==='yes'});renderModal();break;
    case 'ack':ui.done.add('n'+id);modalKey='';$('#modal').innerHTML='';send({t:'ack',id});renderModal();break;
    case 'tab':ui.tab=v;renderGame();scrollTo(0,0);break;
    case 'qr':ui.qr=!ui.qr;renderGame();break;
    case 'copy':{const u=joinUrl(V.code);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('Invite link copied'),()=>toast(u));else toast(u);break}
    case 'leave':leave();break;
  }
  if((hadKick&&a!=='kick')||(hadEnd&&a!=='end')){if(ui.screen==='game'&&a!=='tab')renderGame()}
});
document.addEventListener('touchstart',unlockAudio,{passive:true});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='nd'){send({t:'nd',v:el.checked});if(C)C.nd=el.checked}
  if(el.dataset.a==='wake'){wakeOn=el.checked;if(wakeOn)wake();else unwake()}
});

/* ---------- start ---------- */
const qp=new URLSearchParams(location.search).get('room');
if(qp){
  const code=qp.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  const me=LS.get('sm-me',null);
  if(me&&me.code===code&&!me.host)startClient(me);
  else{ui.screen='join';renderJoin(code)}
}else renderHome();
}
</script>
</body>
</html>
